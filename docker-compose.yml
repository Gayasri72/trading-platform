
services:
  postgres:
    image: postgres:17
    container_name: gotrade-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: gotrade
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: gotrade

    ports:
      - "5433:5432"

    volumes:
      - gotrade_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gotrade -d gotrade"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  gotrade_data:
